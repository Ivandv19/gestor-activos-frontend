<section class="wrapper">
  <!-- Alerta 1: Licencias -->
  <div class="alert-row">
    <div class="alert-left-section">
      <div class="alert-icon-container">
        <img src="https://gestor-assets.mgdc.site/icono-licencia-proxima-a-vencer.png" alt="Licencia" />
      </div>
      <div class="alert-info">
        <span class="alert-description">Licencias próximas a vencer</span>
        <span class="alert-status-text text-naranja">Atención Requerida</span>
      </div>
    </div>
    <div class="alert-right-section">
      <div class="count-badge" [class.has-items]="licenciasProximasAVencer > 0">
        {{ licenciasProximasAVencer }}
      </div>
      <button 
        class="btn-alert-action"
        [disabled]="licenciasProximasAVencer === 0"
        (click)="navegarAFiltro('licencia_proxima')"
      >
        Gestionar
      </button>
    </div>
  </div>

  <!-- Alerta 2: Garantías -->
  <div class="alert-row">
    <div class="alert-left-section">
      <div class="alert-icon-container">
        <img src="https://gestor-assets.mgdc.site/icono-garantias-proxximas-a-expirar.png" alt="Garantía" />
      </div>
      <div class="alert-info">
        <span class="alert-description">Garantías próximas a expirar</span>
        <span class="alert-status-text text-amarillo">Próximo Vencimiento</span>
      </div>
    </div>
    <div class="alert-right-section">
      <div class="count-badge" [class.has-items]="garantiasProximasAExpirar > 0">
        {{ garantiasProximasAExpirar }}
      </div>
      <button 
        class="btn-alert-action"
        [disabled]="garantiasProximasAExpirar === 0"
        (click)="navegarAFiltro('garantia_proxima')"
      >
        Gestionar
      </button>
    </div>
  </div>

  <!-- Alerta 3: Mantenimiento -->
  <div class="alert-row">
    <div class="alert-left-section">
      <div class="alert-icon-container">
        <img src="https://gestor-assets.mgdc.site/icono-activos-en-mantenimiento.png" alt="Mantenimiento" />
      </div>
      <div class="alert-info">
        <span class="alert-description">Activos en mantenimiento</span>
        <span class="alert-status-text text-gris">En Proceso</span>
      </div>
    </div>
    <div class="alert-right-section">
      <div class="count-badge" [class.has-items]="activosEnMantenimiento > 0">
        {{ activosEnMantenimiento }}
      </div>
      <button 
        class="btn-alert-action"
        [disabled]="activosEnMantenimiento === 0"
        (click)="navegarAFiltro('estado')"
      >
        Ver Estado
      </button>
    </div>
  </div>

  <!-- Alerta 4: Devoluciones -->
  <div class="alert-row">
    <div class="alert-left-section">
      <div class="alert-icon-container">
        <img src="https://gestor-assets.mgdc.site/icono-activos-proximos-a-devolver.png" alt="Devolución" />
      </div>
      <div class="alert-info">
        <span class="alert-description">Activos próximos a devolver</span>
        <span class="alert-status-text text-verde">Por Devolver</span>
      </div>
    </div>
    <div class="alert-right-section">
      <div class="count-badge" [class.has-items]="activosProximosADevolver > 0">
        {{ activosProximosADevolver }}
      </div>
      <button 
        class="btn-alert-action"
        [disabled]="activosProximosADevolver === 0"
        (click)="navegarAFiltro('fecha_devolucion_proxima')"
      >
        Ver Detalles
      </button>
    </div>
  </div>
</section>
