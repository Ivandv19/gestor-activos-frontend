<main>
  <div class="container">
    <div class="form-card">
      <!-- Encabezado del Activo -->
      <header class="asset-header">
        <div class="asset-icon">
          <img 
            [src]="getAssetPhoto(fotoActivo) || 'https://gestor-assets.mgdc.site/gestionar-activos.png'" 
            alt="Foto Activo" 
            [style.object-fit]="'cover'"
            style="width: 100%; height: 100%; border-radius: 15px;"
          />
        </div>
        <div class="asset-info-title">
          <span>Editando Asignación</span>
          <h1>{{ asignacionForm.get('nombre')?.value || 'Cargando activo...' }}</h1>
        </div>
      </header>

      <form [formGroup]="asignacionForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          
          <!-- Columna Izquierda -->
          <div class="form-group">
            <label for="usuario_id">Usuario Responsable</label>
            <ng-select
              id="usuario_id"
              formControlName="usuario_id"
              [items]="usuarios"
              bindLabel="nombre"
              bindValue="id"
              placeholder="Seleccionar usuario..."
            >
            </ng-select>
          </div>

          <div class="form-group">
            <label for="fecha_asignacion">Fecha de Asignación</label>
            <input
              type="date"
              id="fecha_asignacion"
              formControlName="fecha_asignacion"
            />
          </div>

          <div class="form-group">
            <label for="ubicacion_id">Ubicación de Destino</label>
            <ng-select
              id="ubicacion_id"
              formControlName="ubicacion_id"
              [items]="ubicaciones"
              bindLabel="nombre"
              bindValue="id"
              placeholder="Seleccionar ubicación..."
            >
            </ng-select>
          </div>

          <div class="form-group">
            <label for="fecha_devolucion">Fecha Estimada Devolución</label>
            <input
              type="date"
              id="fecha_devolucion"
              formControlName="fecha_devolucion"
            />
          </div>

          <!-- Ancho Completo -->
          <div class="form-group full-width">
            <label for="comentarios">Comentarios / Observaciones</label>
            <textarea
              id="comentarios"
              formControlName="comentarios"
              placeholder="Notas relevantes sobre la edición..."
            ></textarea>
          </div>

        </div>

        <!-- Botones de Acción -->
        <div class="actions-container">
          <button type="button" class="btn-cancelar" (click)="cancelarEdicion()">
            Cancelar
          </button>
          
          <div style="display: flex; gap: 10px;">
            <button type="button" (click)="eliminarAsignacion()" class="btn-eliminar">
              Eliminar Asignación
            </button>
            <button type="submit" class="btn-guardar" [disabled]="!asignacionForm.valid">
              Guardar Cambios
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</main>
