<main>
  <div class="container">
    <div class="config-grid">
      
      <!-- Panel Izquierdo: Ajustes Generales -->
      <section class="config-card">
        <header class="card-header">
          <iconify-icon icon="lucide:settings-2"></iconify-icon>
          <h3>Ajustes del Sistema</h3>
        </header>

        <form [formGroup]="configuracionForm">
          <div class="form-grid">
            <!-- Idioma -->
            <div class="form-group full-width">
              <label>Idioma del Sistema</label>
              <ng-select
                formControlName="idioma"
                [items]="idiomasDisponibles"
                bindLabel="nombre"
                bindValue="codigo"
                placeholder="Selecciona idioma"
              ></ng-select>
            </div>

            <!-- Zona Horaria -->
            <div class="form-group full-width">
              <label>Zona Horaria</label>
              <ng-select
                formControlName="zona_horaria"
                [items]="zonasHorariasDisponibles"
                bindLabel="nombre"
                bindValue="codigo"
                placeholder="Selecciona zona"
              ></ng-select>
            </div>

            <!-- Formato de Fecha -->
            <div class="form-group">
              <label>Formato de Fecha</label>
              <ng-select
                formControlName="formato_fecha"
                [items]="formatosFechaDisponibles"
                bindLabel="nombre"
                bindValue="codigo"
                placeholder="DD/MM/YYYY"
              ></ng-select>
            </div>

            <!-- Moneda -->
            <div class="form-group">
              <label>Moneda Local</label>
              <ng-select
                formControlName="formato_moneda"
                [items]="monedasDisponibles"
                bindLabel="nombre"
                bindValue="codigo"
                placeholder="MXN, USD..."
              ></ng-select>
            </div>
          </div>

          <div class="actions-row">
            <button type="button" class="btn-cancelar" (click)="cancelarConfiguracion()">Cancelar</button>
            <button type="button" class="btn-guardar" (click)="guardarConfiguracion()">Guardar Cambios</button>
          </div>
        </form>
      </section>

      <!-- Panel Derecho: Perfil de Usuario -->
      <section class="config-card">
        <header class="card-header">
          <iconify-icon icon="lucide:user-circle"></iconify-icon>
          <h3>Perfil y Seguridad</h3>
        </header>

        <form [formGroup]="perfilForm">
          <!-- Avatar Section -->
          <div class="avatar-section">
            <div class="avatar-wrapper">
              <div class="avatar-container" (click)="fileInput.click()">
                <img *ngIf="previewUrl()" [src]="previewUrl()" alt="Avatar">
                <div *ngIf="!previewUrl()" class="avatar-placeholder">
                  <iconify-icon icon="lucide:user" style="font-size: 48px; color: #cbd5e0;"></iconify-icon>
                </div>
                <div class="avatar-overlay">
                  <iconify-icon icon="lucide:camera" style="font-size: 24px;"></iconify-icon>
                  <span>Cambiar</span>
                </div>
              </div>
              <label for="imagen" class="avatar-edit-badge" title="Cambiar foto">
                <iconify-icon icon="lucide:plus"></iconify-icon>
              </label>
            </div>
            <p class="avatar-hint">JPG o PNG. Máximo 2MB.</p>
            <input
              #fileInput
              type="file"
              id="imagen"
              style="display: none;"
              accept="image/*"
              (change)="onFileSelected($event)"
            />
          </div>

          <div class="form-grid">
            <!-- Nombre -->
            <div class="form-group full-width">
              <label>Nombre Completo</label>
              <input type="text" formControlName="nombre" placeholder="Tu nombre">
            </div>

            <!-- Correo -->
            <div class="form-group">
              <label>Correo Electrónico</label>
              <input type="email" formControlName="email" placeholder="correo@empresa.com">
            </div>

            <!-- Departamento -->
            <div class="form-group">
              <label>Departamento</label>
              <input type="text" formControlName="departamento" placeholder="Área">
            </div>
          </div>

          <!-- Caja de Seguridad -->
          <div class="security-box">
            <h4>
              <iconify-icon icon="lucide:lock" style="font-size: 16px;"></iconify-icon>
              Cambiar Contraseña
            </h4>
            <div class="form-group">
              <label>Contraseña Actual</label>
              <input type="password" formControlName="contrasena_actual" placeholder="••••••••">
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label>Nueva Contraseña</label>
                <input type="password" formControlName="nueva_contrasena" placeholder="Nueva">
              </div>
              <div class="form-group">
                <label>Confirmar</label>
                <input type="password" formControlName="confirmar_nueva_contrasena" placeholder="Repetir">
              </div>
            </div>
          </div>

          <div class="actions-row">
            <button type="button" class="btn-cancelar" (click)="cancelarPerfil()">Cancelar</button>
            <button type="button" class="btn-guardar" (click)="guardarPerfil()">Actualizar Perfil</button>
          </div>
        </form>
      </section>

    </div>
  </div>
</main>
