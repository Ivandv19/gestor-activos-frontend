<div
  [ngClass]="[
    isLoginPage() ? 'container-login' : '',
    isLoginPage() ? 'login-layout' : ''
  ]"
  class="main-grid"
  [class.full-height-login]="isLoginPage()">

  <a href="#main-content" class="skip-link">Ir al contenido principal</a>

  <!-- Primera columna: Navbar -->
  @if (showNavbar()) {
    <div class="navbar-column">
      <app-navbar></app-navbar>
    </div>
  }

  <!-- Segunda columna: Contenido principal (router-outlet) -->
  <div class="content-column" id="main-content">
    <!-- Encabezado de la aplicación (Se oculta en login) -->
    @if (!isLoginPage()) {
      <app-header></app-header>
    }

    <div class="router-wrapper">
      <router-outlet></router-outlet>
    </div>
    
    <!-- Pie de página de la aplicación (Se oculta en login) -->
    @if (!isLoginPage()) {
      <app-footer></app-footer>
    }
  </div>
</div>
